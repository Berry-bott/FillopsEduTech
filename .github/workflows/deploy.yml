name: Deploy Frontend
on:
  push:
    branches: [ "master" ]
    jobs:
    deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.0.3
          with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2432
          script_stop: true
          script: |
            set -e
            cd ~/FillopsEduTech
            git pull origin master
            npm install
            npm run build
            sudo systemctl restart nginx


