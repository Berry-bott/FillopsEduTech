name: Deploy Frontend
on:
  push:
    branches: [ "master" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2432
          script_stop: true
          script: |
            set -e

            cd ~/FillopsEduTech

            git fetch origin
            git reset --hard origin/master

            cd client

            npm install
            NODE_OPTIONS="--max-old-space-size=4096" npm run build